<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rilievo sopralluogo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5fbf">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#1c2230;--mut:#687185;--line:#dde1e8;--acc:#1f5fbf;--accbg:#e6efff;--warn:#a86a12;--warnbg:#fff3dc;--bad:#c0392b;--badbg:#fde8e5;--ok:#2f855a;--okbg:#e3f5ea;--wall:#d6d9e1;--wP:#1c2230;--wI:#b8860b;--wR:#d0342c;--grid:#eceef3;--cv:#fbfbfd;--note:#c99a06;--todo:#e8890c;--inkc:#7c3aed;--notebg:#fff8d9}
@media (prefers-color-scheme:dark){:root{--bg:#13161c;--card:#1b1f28;--ink:#e7eaf1;--mut:#99a1b2;--line:#2c3240;--acc:#5b9bff;--accbg:#1d2e4d;--warn:#e3a94b;--warnbg:#3a2f18;--bad:#ef6b5b;--badbg:#3d1f1b;--ok:#5fc08a;--okbg:#17331f;--wall:#2f3542;--wP:#f1f3f8;--wI:#e2b33c;--wR:#ff6b5f;--grid:#20242d;--cv:#171a21;--note:#d8ad2c;--todo:#e8890c;--inkc:#b39bff;--notebg:#352f17}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0 6px 0 0}
.sp{flex:1}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:9px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
button.bad{color:var(--bad)}
button.sm{padding:4px 9px;min-height:32px;font-size:13px}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 10px;width:100%;min-height:40px}
input[type=checkbox]{width:auto;min-height:auto}
nav{display:flex;gap:4px;padding:10px 16px 0;max-width:1600px;margin:0 auto}
nav button{border:0;background:none;color:var(--mut)}
nav button.on{background:var(--accbg);color:var(--acc)}
main{padding:12px 16px 40px;max-width:1600px;margin:0 auto}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);padding:10px 14px;border-radius:10px;margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr 400px;gap:14px;align-items:start}
@media(max-width:1050px){.cols{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.cardh{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:600;flex-wrap:wrap}
.cardh small{font-weight:400;color:var(--mut)}
.tbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.tbar .tcl{display:flex;gap:2px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tbar .tmain{order:0}
.tbar .tsep{width:1px;align-self:stretch;margin:6px 3px;background:var(--line)}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:60px;min-height:56px;padding:5px 6px 4px;border:0;border-radius:10px;background:none;font-size:11.5px;line-height:1.1;color:var(--ink);font-weight:500;white-space:nowrap}
.tb>*{pointer-events:none}
.tb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb:hover{background:var(--accbg)}
.tb.on{background:var(--accbg);color:var(--acc);border:0;font-weight:700}
.tb.sm{min-width:48px}
.tb .car{position:absolute;right:4px;bottom:4px;width:0;height:0;border-left:5px solid transparent;border-bottom:5px solid currentColor;opacity:.55}
.tg{position:relative;display:flex}
.tfly{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);display:none;gap:2px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.22);z-index:40}
.tfly::before{content:'';position:absolute;top:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-top:0;border-bottom-color:var(--line)}
.tg.open .tfly{display:flex}
.tg.open>.tb{background:var(--accbg)}
label.tb input{display:none}
label.tb:has(input:checked){color:var(--acc);background:var(--accbg)}
.cvcard{container-type:inline-size}
@container (max-width:1060px){.tbar .tmain{order:-1;margin:0 auto;flex-wrap:wrap;justify-content:center}.tbar .tcl:not(.tmain){flex:0 0 auto}.tbar::after{content:'';order:-1;flex-basis:100%;height:0}}
@container (max-width:560px){.tb{min-width:50px;font-size:10.5px;padding:4px 3px}.tb.sm{min-width:44px}.tbar .tmain{border:0;box-shadow:none;background:none;padding:0}}
#vrot{position:absolute;top:8px;right:8px;z-index:6;display:flex;align-items:center;gap:2px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#vrot button{width:40px;height:40px;padding:0;border:0;border-radius:9px;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
#vrot button:hover{background:var(--accbg)} #vrot button>*{pointer-events:none}
#vrot #bRot0{width:auto;min-width:34px;color:var(--mut,#888)} #vrot.on #bRot0{color:var(--acc)}
@media(min-width:701px){body.full.hassel #vrot{right:calc(min(380px,44vw) + 14px)}}   /* a schermo intero il pannello sta in alto a destra: le frecce si spostano accanto */
#vrot svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#cv{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--cv)}
#svg{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);pointer-events:none;padding:30px}
#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 14px;border-radius:9px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 10px}
.grid .c2{grid-column:1/-1}
label.l{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:16px 0 8px}
.ap{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px 8px;position:relative}
.ap .rm{position:absolute;top:-10px;right:-8px;background:var(--card)}
.ap.hl{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.b{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--accbg);color:var(--acc);white-space:nowrap}
.b.w{background:var(--warnbg);color:var(--warn)}.b.r{background:var(--badbg);color:var(--bad)}.b.g{background:var(--okbg);color:var(--ok)}
.msg{padding:6px 10px;border-radius:8px;margin-bottom:6px;font-size:14px}
.msg.e{background:var(--badbg);color:var(--bad)}.msg.w{background:var(--warnbg);color:var(--warn)}.msg.o{background:var(--okbg);color:var(--ok)}
.msg[data-selw]{cursor:pointer;text-decoration:underline dotted}
.info{background:var(--bg);border-radius:9px;padding:8px 10px;font-size:14px;margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right}
.tw{overflow:auto}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0}
ol.help{margin:6px 0 0;padding-left:20px;font-size:14px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(760px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.arow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.arow.cur{border-color:var(--acc);background:var(--accbg)}
.arow .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#bExp.dirty::after{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
body.full header,body.full nav,body.full .banner,body.full .legend{display:none}
body.full main{padding:6px;max-width:none}
body.full .cols{display:grid;grid-template-columns:minmax(0,1fr) min(380px,42vw);gap:8px;align-items:start}
body.full .cols>.card{margin:0;padding:8px}
body.full #sidecol{height:calc(100vh - 12px);overflow:auto}
body.full #sidecol .card{margin-bottom:8px}
@media(max-width:700px){body.full .cols{display:block}body.full #sidecol{height:auto;overflow:visible;margin-top:8px}}
#bCloseSide{display:none}
.mpop{position:fixed;inset:0;z-index:60;background:rgba(15,20,30,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.mpop.guide{background:rgba(15,20,30,.08)}
@media(min-width:701px){.mpop.guide.gl{justify-content:flex-start}.mpop.guide.gr{justify-content:flex-end}.mpop.guide .mbox{width:min(340px,40vw)}}
.mpop .mskip{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.mpop .mbox{width:min(380px,100%);background:var(--card);border-radius:18px;box-shadow:0 16px 48px rgba(0,0,0,.3);overflow:hidden}
.mpop .mhd{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 18px 10px;gap:10px}
.mpop .mt{font-size:21px;font-weight:700}
.mpop .ms{font-size:14px;color:var(--mut);margin-top:2px}
.mpop .mx{width:40px;height:40px;min-height:40px;border-radius:50%;padding:0;font-size:18px;flex:0 0 auto}
.mpop .mval{text-align:center;font-size:44px;font-weight:500;padding:14px 0 2px;background:var(--bg);border-top:1px solid var(--line)}
.mpop .mval .mu{font-size:24px;color:var(--mut);margin-left:6px}
.mpop .mval .mph{color:var(--mut)}
.mpop .mhint{text-align:center;font-size:13px;color:var(--mut);background:var(--bg);padding:0 0 10px}
.mpop .mkeys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px;background:var(--bg)}
.mpop .mkeys button{height:58px;min-height:58px;font-size:24px;border-radius:12px;background:var(--card)}
.mpop .mkeys .mk2{background:transparent;border-color:transparent}
.mpop .mfoot{display:flex;gap:10px;padding:12px 16px 16px;background:var(--bg)}
.mpop .mok{flex:1;height:52px;min-height:52px;font-size:19px;font-weight:600;background:#222;color:#fff;border-color:#222;border-radius:12px}
.mpop .mdel{height:52px;min-height:52px;color:var(--bad)}
@media(max-width:700px){.mpop{align-items:flex-end;padding:0}.mpop .mbox{border-radius:18px 18px 0 0}}
#fstrip{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
#fstrip .fsh{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
#fstrip .fsh .sp{flex:1}
#fstrip .fsr{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
#fstrip .fsr button{flex:0 0 auto;width:112px;padding:0;border-radius:10px;overflow:hidden;background:var(--card);display:flex;flex-direction:column;min-height:0}
#fstrip .fsr img{width:112px;height:84px;object-fit:cover;display:block}
#fstrip .fsr span{font-size:11.5px;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);text-align:left}
body.full #fstrip{display:none}
/* schermo intero: tutta la larghezza al disegno; il pannello compare sopra la tavola solo quando tocchi un elemento */
body.full .cols{display:block}
body.full #sidecol{display:none}
body.full.hassel #sidecol{display:block;position:fixed;top:10px;right:10px;width:min(380px,44vw);max-height:calc(100vh - 20px);overflow:auto;z-index:20;margin:0;padding:6px;border-radius:14px;background:var(--bg);box-shadow:0 8px 28px rgba(0,0,0,.28)}
body.full.hassel #sidecol .card{margin-bottom:0}
body.full #msgs{display:none}
body.full.hassel #bCloseSide{display:block;margin-left:auto}
@media(max-width:700px){body.full.hassel #sidecol{left:10px;width:auto;top:auto;bottom:10px;max-height:55vh}}
ol.help li{margin-bottom:4px}
/* foto */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.fth{position:relative;padding:0;border-radius:8px;overflow:hidden;aspect-ratio:4/3;background:var(--line);display:flex;align-items:center;justify-content:center;min-height:0}
.fth img{width:100%;height:100%;object-fit:cover;display:block}
.fth .fcap{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fmore{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:7;display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap}
#fmore button{min-height:44px}
#fview{position:fixed;inset:0;z-index:60;background:#0c0e12;display:flex;flex-direction:column;color:#fff}
#fview button{color:var(--ink);background:var(--card)}
#fview button.bad{color:var(--bad)}
#fview button:disabled{opacity:.45}
#fview input{color:var(--ink);background:var(--card)}
#fview .fvbar,#fview .fvfoot{display:flex;gap:8px;align-items:center;padding:8px 12px;flex-wrap:wrap}
#fview .fvmeta{font-size:13px;opacity:.75}
#fview .sp{flex:1}
#fview .fvimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px}
#fview .fvimg img{max-width:100%;max-height:100%;object-fit:contain}
#fview input{flex:1;min-width:200px}
</style>
</head>
<body>
<header>
  <h1>Rilievo <span id="curName" class="mut" style="font-weight:400"></span></h1>
  <button id="bArch">Archivio</button>
  <select id="selPiano" style="width:auto"></select>
  <button id="bAddPiano">+ Piano</button>
  <button id="bRenPiano">Rinomina</button>
  <button id="bDelPiano" class="bad">Elimina piano</button>
  <span class="sp"></span>
  <button id="bScr" class="pri">Genera script AutoCAD</button>
  <button id="bExp">Esporta</button>
  <button id="bImp">Importa</button>
  <button id="bNew">Nuovo rilievo</button>
  <input type="file" id="fImp" accept=".json,application/json" hidden>
  <input type="file" id="fCam" accept="image/*" capture="environment" hidden>
  <input type="file" id="fGal" accept="image/*" multiple hidden>
  <input type="file" id="fBgGal" accept="image/jpeg,image/png,image/*" hidden>
  <input type="file" id="fBgCam" accept="image/*" capture="environment" hidden>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<dialog id="dArch"></dialog>

<script>
"use strict";
/* ================= utilità ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const num = v => { if (typeof v === 'number') return v; const n = parseFloat(String(v ?? '').replace(',', '.').trim()); return isFinite(n) ? n : NaN; };
const f2 = n => isFinite(n) ? n.toFixed(2).replace('.', ',') : '—';
const fN = v => String(+(+v).toFixed(3)).replace('.', ',');
const r4 = v => Math.round(v * 10000) / 10000;
const EPS = 0.0005;
const today = () => new Date().toISOString().slice(0, 10);
const ascii = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E]/g, '').trim();

const DEST = {'Soggiorno':'A','Cucina':'A','Soggiorno-cucina':'A','Camera':'A','Studio':'A','Bagno':'C','Disimpegno':'C','Corridoio':'C','Ripostiglio':'C','Lavanderia':'C','Cantina':'C','Garage':'C','Altro':'C'};
const TIPI_AP = {finestra:'Finestra', uscita:'Porta-finestra', porta:'Porta', ingresso:'Ingresso', varco:'Varco (senza infisso)'};
// «Incassata» tra le aperture: si posa come una finestra con la parte larga (a scalino; strombata si sceglie nel pannello)
const apLab = (k, ap) => k === 'incassata' || (ap && ap.tipo === 'finestra' && ap.inc) ? 'Finestra incassata' : TIPI_AP[k];
// misure proposte quando si posa un'apertura con i tasti rapidi (poi si correggono con il laser)
const DEF_AP = {finestra:{l:'1,20', h:'1,40', dav:'0,90'}, incassata:{l:'1,20', h:'1,40', dav:'0,90'}, uscita:{l:'1,20', h:'2,20', dav:''}, porta:{l:'0,80', h:'', dav:''}, ingresso:{l:'1,00', h:'2,10', dav:''}};

/* ================= stato ================= */
let R, G = null, tab = 'pianta';
const ui = {mnew:(() => { try { return localStorage.getItem('rilievo-mstile') !== 'classico'; } catch (e) { return true; } })(), labels:(() => { try { return localStorage.getItem('rilievo-etichette') !== '0'; } catch (e) { return true; } })(), mode:'draw', newType:'P', view:{x:-2, y:-2, s:45}, sel:null, W:800, H:560, undo:[], nbb:new Map()};

function blank() {
  return {nome:'', indirizzo:'', data:today(), P:'0,30', T:'0,10', incP:'0,15', rai:'8', hA:'2,70', hC:'2,40',
    opt:{qInt:true, qExt:true, testi:true, porte:true, note:false, vani:true},
    piani:[{id:uid(), nome:'Piano terra', ver:0, nodes:[], walls:[], rooms:[]}], cur:0, demo:false};
}
const piano = () => R.piani[R.cur] || R.piani[0];
const P_ = () => num(R.P), T_ = () => num(R.T);
/* ---- finestre incassate (palazzi antichi): luce stretta da una faccia (ap.l, è l'infisso), parte larga dall'altra (ap.l2).
   ap.inc = 'scal' (a scalino) o 'strom' (strombata, fianchi obliqui); ap.lw = faccia larga (+1/-1, verso della normale del muro);
   ap.ris = risega dall'inizio del muro (dal bordo largo al bordo della luce), vuota = luce centrata; ap.l2p = larghezza larga proposta.
   La parte stretta è profonda incP() dalla sua faccia (Impostazioni). ---- */
const incP = () => { const v = num(R.incP); return v > 0 ? v : 0.15; };
const incOk = (ap, t) => ap.tipo === 'finestra' && (ap.inc === 'scal' || ap.inc === 'strom') && (ap.lw === 1 || ap.lw === -1) && num(ap.l2) > num(ap.l) + 0.005 && num(ap.l) > 0 && t > incP() + 0.02;
const risMis = ap => String(ap.ris ?? '').trim() !== '' && num(ap.ris) >= 0;
const risOf = ap => risMis(ap) ? num(ap.ris) : (num(ap.l2) - num(ap.l)) / 2;
const risOk = ap => risMis(ap) || (!ap.lp && !ap.l2p);
// come si vede il vano da una faccia del muro (lato r, segno sg): d0 = inizio rispetto alla luce, w = larghezza, prop = larghezza solo proposta
const apFace = (ap, t, sg) => incOk(ap, t) && ap.lw === sg ? {d0:-risOf(ap), w:num(ap.l2), prop:!!ap.l2p, wide:true, rok:risOk(ap)} : {d0:0, w:num(ap.l), prop:!!ap.lp, wide:false, rok:true};

/* ================= topologia ================= */
const nd = (pl, id) => pl.nodes.find(n => n.id === id);

  const t = e.target, pl = piano();
  if (t.id === 'iNord') { const a = num(t.value); if (isFinite(a)) { undemo(); R.nordAng = String(((a % 360) + 360) % 360).replace('.', ','); draw(); save(); } return; }
  if (t.id === 'fvCap') { const f = ui.fview && (ui.fotos || []).find(x => x.id === ui.fview.id); if (!f) return; f.nome = t.value; clearTimeout(ui.tCap); ui.tCap = setTimeout(() => fPut(f).catch(() => {}), 400); return; }
  if (t.dataset.w) { const w = ui.sel && pl.walls.find(x => x.id === ui.sel.id); if (!w) return; if (t.dataset.w === 'filo') lineOf(pl, w).forEach(x => { x.filo = t.value; }); else setW(w, t.dataset.w, t.type === 'checkbox' ? t.checked : t.value); update(t.hasAttribute('data-re')); }
  else if (t.dataset.r) { const r = (pl.rooms || []).find(x => x.id === ui.sel.id); if (!r) return; undemo();
    if (t.dataset.r === 'pieno') { r.pieno = t.checked; update(true); } else { r[t.dataset.r] = t.value; draw(); save(); } }
  else if (t.dataset.run) { setMeasure(pl, 'r', t.dataset.run, t.value); undemo(); update(false); }
  else if (t.dataset.ink) { const k = ui.sel && ui.sel.k === 'ink' && (pl.ink || []).find(x => x.id === ui.sel.id); if (!k) return; undemo();
    if (t.dataset.ink === 'len') { if (num(t.value) > 0) lnSetLen(k, t.value); else if (!String(t.value).trim()) delete k.v; }
    else if (t.dataset.ink === 'tipo') { delete k.lin; delete k.cs; k[t.value] = true; renderSide(); }
    draw(); save(); }
  else if (t.dataset.q) { const q = ui.sel && ui.sel.k === 'q' && (pl.dims || []).find(x => x.id === ui.sel.id); if (!q) return; setMeasure(pl, 'q', q.id, t.value); undemo(); update(false); const qi = $('#qInfo'); if (qi) qi.innerHTML = qInfo((G.dims || []).find(x => x.d === q)); }
  else if (t.dataset.faci) { setMeasure(pl, 'f', t.dataset.faci, t.value); undemo(); update(false); }
  else if (t.dataset.fac) { if (!pl.facc) pl.facc = {}; if (String(t.value).trim()) pl.facc[t.dataset.fac] = t.value; else delete pl.facc[t.dataset.fac]; undemo(); update(false); }
  else if (t.dataset.st) { const sc = ui.sel && ui.sel.k === 's' && (pl.stairs || []).find(x => x.id === ui.sel.id); if (!sc) return; undemo();
    const f = t.dataset.st; sc[f] = t.type === 'checkbox' ? t.checked : t.value;
    if (SC_SYNC.includes(f)) linkedStairs(sc).forEach(o => { o[f] = sc[f]; });
    const on = di => (R.piani[R.cur + di] && (R.piani[R.cur + di].stairs || []).find(o => o.link === sc.link)) || null;
    if (['n', 'a', 'n1'].includes(f)) {   // un tratto: parte da un piano e arriva a quello sopra
      if (sc.dir === 'scende') { const d = on(-1); if (d) d[f] = sc[f]; }
      else { const u = on(1); if (u) { if (u.dir === 'inter') u[f + 'A'] = sc[f]; else if (u.dir === 'scende') u[f] = sc[f]; } } }
    if (['nA', 'aA', 'n1A'].includes(f)) { const d = on(-1); if (d) d[f.slice(0, -1)] = sc[f]; }
    if (f === 'dir' && sc.dir === 'inter' && !sc.nA) { const d = on(-1); Object.assign(sc, d ? {nA:d.n, aA:d.a, n1A:d.n1} : {nA:sc.n, aA:sc.a, n1A:sc.n1}); }
    if (t.hasAttribute('data-re')) update(true); else { update(false); const si = $('#sInfo'); if (si) si.innerHTML = stInfo(sc); } }
  else if (t.dataset.n) { const n = (pl.notes || []).find(x => ui.sel && x.id === ui.sel.id); if (!n) return; n.t = t.value; draw(); save(); }
  else if (t.dataset.s) { undemo(); R[t.dataset.s] = t.value; recompute(); save(); updExpBadge(); }
  else if (t.id === 'cVano') { ui.copyVano = t.checked; }
  else if (t.id === 'iBgOp' && pl.bg) { pl.bg.op = +t.value; draw(); save(); }
  else if ((t.id === 'cBgHide' || t.id === 'cBgLock') && pl.bg) { pushUndo(); pl.bg[t.id === 'cBgHide' ? 'hide' : 'lock'] = t.checked; if (pl.bg.lock) { ui.bgMove = false; ui.bgCal = null; } save(); draw(); renderSide(); }
  else if (t.id === 'cLab') { ui.labels = t.checked; try { localStorage.setItem('rilievo-etichette', t.checked ? '1' : '0'); } catch (e) {} draw(); }
  else if (t.dataset.pref === 'mclassic') { ui.mnew = !t.checked; try { localStorage.setItem('rilievo-mstile', t.checked ? 'classico' : 'nuovo'); } catch (e) {} }
  else if (t.dataset.o) { R.opt[t.dataset.o] = t.checked; save(); }
});
$('#selPiano').onchange = e => { R.cur = +e.target.value; ui.sel = null; ui.undo = []; ui.redo = []; ui.fitted = false; render(); save(); };
$('#bAddPiano').onclick = () => { const n = prompt('Nome del nuovo piano:', 'Piano primo'); if (!n) return; R.piani.push({id:uid(), nome:n, ver:0, nodes:[], walls:[], rooms:[]}); R.cur = R.piani.length - 1; ui.sel = null; ui.undo = []; ui.redo = []; ui.fitted = false; render(); save(); };
$('#bRenPiano').onclick = () => { const n = prompt('Nuovo nome del piano:', piano().nome); if (!n) return; piano().nome = n; render(); save(); };
$('#bDelPiano').onclick = () => { if (R.piani.length < 2) { alert('Deve restare almeno un piano.'); return; } if (!confirm('Eliminare il piano «' + piano().nome + '» con tutti i suoi muri e le sue foto?')) return; { const pid = piano().id; (ui.fotos || []).filter(f => f.piano === pid).forEach(f => fDel(f.id).catch(() => {})); ui.fotos = (ui.fotos || []).filter(f => f.piano !== pid); } R.piani.splice(R.cur, 1); R.cur = 0; ui.sel = null; ui.undo = []; ui.redo = []; ui.fitted = false; render(); save(); };
$('#bNew').onclick = () => { const n = blank(); n.id = uid(); n.unexp = true; n.mod = new Date().toISOString(); arcPut(n); ui.mode = 'draw'; ui.newType = 'P'; openRilievo(n); toast('Nuovo rilievo: il precedente resta nell\'Archivio.'); };
$('#bExp').onclick = () => { if (R.demo) { exportR(R); return; } exportR(R); R.unexp = false; arcPut(R); updExpBadge(); };
$('#bArch').onclick = showArchive;
const onFoto = async e => { const fs = [...e.target.files]; e.target.value = ''; const pt = ui.fotoPt; ui.fotoPt = null; if (!fs.length) return;
  const n = await addFotos(fs, pt);
  if (tab === 'pianta') { draw(); if (n && pt) { ui.morePt = pt; showMore(); } else if (n) toast(n === 1 ? 'Foto salvata.' : n + ' foto salvate.'); } else if (tab === 'foto') renderFotoTab(); };
$('#fCam').onchange = onFoto; $('#fGal').onchange = onFoto;
$('#fBgGal').onchange = $('#fBgCam').onchange = e => { const f = e.target.files[0]; e.target.value = ''; bgLoad(f); };
$('#bImp').onclick = () => $('#fImp').click();
$('#fImp').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d.piani || !d.piani.length || !d.piani[0].walls) throw new Error('non è un rilievo di questa app');
    const n = Object.assign(blank(), d); n.opt = Object.assign(blank().opt, d.opt || {}); n.cur = 0; n.demo = false;
    if (!n.id || arcIndex().some(x => x.id === n.id)) { if (n.id && !confirm('«' + (d.nome || f.name) + '» è già nell\'Archivio. Aggiungerlo come copia?\n(Annulla per non importarlo)')) return; n.id = uid(); }
    n.unexp = false; n.mod = new Date().toISOString(); arcPut(n); openRilievo(n); toast('Rilievo importato nell\'Archivio.'); }
  catch (err) { alert('File non valido: ' + err.message); }
  e.target.value = '';
};
$('#bScr').onclick = () => {
  recompute(); const pl = piano();
  if (!pl.walls.length) { alert('Nessun muro in questo piano.'); return; }
  const avv = [...G.errs.map(x => x.t), ...(nonTorna() ? ['Ci sono misure che non tornano (vedi Controlli).'] : [])];
  if (avv.length && !confirm('Attenzione:\n\n- ' + avv.join('\n- ') + '\n\nGenerare lo script lo stesso?')) return;
  pl.ver = (pl.ver || 0) + 1;
  download(fileBase() + '_' + ascii(pl.nome).replace(/[^A-Za-z0-9_-]+/g, '_') + '_v' + pl.ver + '.scr', genScript(pl), 'text/plain');
  save();
};

/* ================= avvio ================= */
R = load() || demo();
render(); updExpBadge();
</script>
