<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rilievo sopralluogo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5fbf">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#1c2230;--mut:#687185;--line:#dde1e8;--acc:#1f5fbf;--accbg:#e6efff;--warn:#a86a12;--warnbg:#fff3dc;--bad:#c0392b;--badbg:#fde8e5;--ok:#2f855a;--okbg:#e3f5ea;--wall:#d6d9e1;--wP:#1c2230;--wI:#b8860b;--wR:#d0342c;--grid:#eceef3;--cv:#fbfbfd;--note:#c99a06;--todo:#e8890c;--inkc:#7c3aed;--notebg:#fff8d9}
@media (prefers-color-scheme:dark){:root{--bg:#13161c;--card:#1b1f28;--ink:#e7eaf1;--mut:#99a1b2;--line:#2c3240;--acc:#5b9bff;--accbg:#1d2e4d;--warn:#e3a94b;--warnbg:#3a2f18;--bad:#ef6b5b;--badbg:#3d1f1b;--ok:#5fc08a;--okbg:#17331f;--wall:#2f3542;--wP:#f1f3f8;--wI:#e2b33c;--wR:#ff6b5f;--grid:#20242d;--cv:#171a21;--note:#d8ad2c;--todo:#e8890c;--inkc:#b39bff;--notebg:#352f17}}
:root[data-tema="chiaro"]{color-scheme:light;--bg:#f3f4f7;--card:#fff;--ink:#1c2230;--mut:#687185;--line:#dde1e8;--acc:#1f5fbf;--accbg:#e6efff;--warn:#a86a12;--warnbg:#fff3dc;--bad:#c0392b;--badbg:#fde8e5;--ok:#2f855a;--okbg:#e3f5ea;--wall:#d6d9e1;--wP:#1c2230;--wI:#b8860b;--wR:#d0342c;--grid:#eceef3;--cv:#fbfbfd;--note:#c99a06;--todo:#e8890c;--inkc:#7c3aed;--notebg:#fff8d9}
:root[data-tema="scuro"]{color-scheme:dark;--bg:#13161c;--card:#1b1f28;--ink:#e7eaf1;--mut:#99a1b2;--line:#2c3240;--acc:#5b9bff;--accbg:#1d2e4d;--warn:#e3a94b;--warnbg:#3a2f18;--bad:#ef6b5b;--badbg:#3d1f1b;--ok:#5fc08a;--okbg:#17331f;--wall:#2f3542;--wP:#f1f3f8;--wI:#e2b33c;--wR:#ff6b5f;--grid:#20242d;--cv:#171a21;--note:#d8ad2c;--todo:#e8890c;--inkc:#b39bff;--notebg:#352f17}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0 6px 0 0}
.sp{flex:1}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:9px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
button.bad{color:var(--bad)}
button.sm{padding:4px 9px;min-height:32px;font-size:13px}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 10px;width:100%;min-height:40px}
input[type=checkbox]{width:auto;min-height:auto}
main{padding:12px 16px 40px;max-width:1600px;margin:0 auto}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);padding:10px 14px;border-radius:10px;margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr 400px;gap:14px;align-items:start}
@media(max-width:1050px){.cols{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.cardh{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:600;flex-wrap:wrap}
.cardh small{font-weight:400;color:var(--mut)}
.tbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.tbar .tcl{display:flex;gap:2px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tbar .tmain{order:0}
.tbar .tsep{width:1px;align-self:stretch;margin:6px 3px;background:var(--line)}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:60px;min-height:56px;padding:5px 6px 4px;border:0;border-radius:10px;background:none;font-size:11.5px;line-height:1.1;color:var(--ink);font-weight:500;white-space:nowrap}
.tb>*{pointer-events:none}
.tmain .tb{min-width:56px;padding-left:4px;padding-right:4px}   /* barra principale un po' più stretta: con Porte e Finestre resta su una riga anche a schermo intero */
.tb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb:hover{background:var(--accbg)}
.tb.on{background:var(--accbg);color:var(--acc);border:0;font-weight:700}
.tb.sm{min-width:48px}
#bGrafica{padding-left:1px;padding-right:1px}   /* «Mod chiara» è lungo: così a 1280 px a schermo intero la barra resta su una riga */
.tb .car{position:absolute;right:4px;bottom:4px;width:0;height:0;border-left:5px solid transparent;border-bottom:5px solid currentColor;opacity:.55}
.tg{position:relative;display:flex}
.tfly{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);display:none;gap:2px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.22);z-index:40}
.tfly::before{content:'';position:absolute;top:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-top:0;border-bottom-color:var(--line)}
.tg.open .tfly{display:flex}
.tg.open>.tb{background:var(--accbg)}
label.tb input{display:none}
label.tb:has(input:checked){color:var(--acc);background:var(--accbg)}
.cvcard{container-type:inline-size}
@container (max-width:1060px){.tbar .tmain{order:-1;margin:0 auto;flex-wrap:wrap;justify-content:center}.tbar .tcl:not(.tmain){flex:0 0 auto}.tbar::after{content:'';order:-1;flex-basis:100%;height:0}}
@container (max-width:560px){.tb,.tmain .tb{min-width:50px;font-size:10.5px;padding:4px 3px}.tb.sm{min-width:44px}.tbar .tmain{border:0;box-shadow:none;background:none;padding:0}}
#vrot{position:absolute;top:8px;right:8px;z-index:6;display:flex;align-items:center;gap:2px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#vrot button{width:40px;height:40px;padding:0;border:0;border-radius:9px;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
#vrot button:hover{background:var(--accbg)} #vrot button>*{pointer-events:none}
#vrot #bRot0{width:auto;min-width:34px;color:var(--mut,#888)} #vrot.on #bRot0{color:var(--acc)}
@media(min-width:701px){body.full.hassel #vrot{right:calc(min(380px,44vw) + 14px)}}   /* a schermo intero il pannello sta in alto a destra: le frecce si spostano accanto */
.sezv{height:calc(100vh - 200px);min-height:340px;background:var(--cv);border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none}
.sezv svg{width:100%;height:100%;display:block}
.sezv.chiaro{--ink:#1c2230;--wP:#111418;--wall:#d6d9e1;--cv:#fbfbfd;--mut:#687185;background:#fbfbfd}
.sezv.scuro{--ink:#e7eaf1;--wP:#f1f3f8;--wall:#2f3542;--cv:#171a21;--mut:#99a1b2;background:#171a21}
.sezmini svg{width:100%;height:100%;display:block}
#bPamb{position:absolute;top:62px;right:8px;z-index:6;width:40px;height:40px;padding:0;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12);color:var(--mut,#888);display:flex;align-items:center;justify-content:center}
#bPamb.on{color:var(--acc)} #bPamb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
@media(min-width:701px){body.full.hassel #bPamb{right:calc(min(380px,44vw) + 14px)}}
body.sidoff #sidecol{display:none!important} body.sidoff .cols,body.full.sidoff .cols{grid-template-columns:minmax(0,1fr)}
#vrot svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#appan{position:absolute;top:58px;right:8px;z-index:7;width:184px;max-height:calc(100% - 66px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px}
#appan .aph{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px 8px;font-weight:700;font-size:14px}
#appan .aph button{width:32px;height:32px;border:0;border-radius:9px;background:none;color:var(--ink);font-size:16px;padding:0}
#appan .apl{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#appan .api{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 6px;border:1px solid transparent;border-radius:10px;background:none;color:var(--ink);font-size:11.5px;line-height:1.15;text-align:center;min-height:74px}
#appan .api svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#appan .api.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:700}
#appan .api>*{pointer-events:none}
#appan .lyr{display:flex;align-items:center;gap:2px;padding:1px 2px 1px 6px;border-radius:9px}#appan .lyr.off .lyn{color:var(--mut)}#appan .lyn{flex:1;font-size:12.5px;line-height:1.2}
#appan .lyb{width:34px;height:34px;padding:5px;border:0;border-radius:9px;background:none;color:var(--mut);display:inline-flex;align-items:center;justify-content:center}#appan .lyb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}#appan .lyb.on{color:var(--acc)}#appan .lyb.lk{color:var(--bad)}
.incl{border:1px solid var(--acc);border-radius:8px;padding:8px;margin:8px 0}.incl p{margin:4px 0;font-size:13px}.iopt{display:block;width:100%;text-align:left;margin:5px 0;padding:7px 8px;line-height:1.35;font-size:13px}.iopt.off{opacity:.65;border:1px dashed var(--mut);border-radius:6px;background:none;cursor:default}.iopt .ich{display:block;color:var(--mut);font-size:12px}.iopt .iw{display:block;color:var(--warn);font-size:12px}
#appan .aphint{font-size:11.5px;color:var(--mut);padding:6px 6px 2px;line-height:1.3}
@media(min-width:701px){body.full.hassel #appan{right:calc(min(380px,44vw) + 14px)}}
#cv{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--cv)}
#svg{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#svg.gn{background:#f1f1f3;--ink:#111418;--mut:#5f6675;--line:#dde1e8;--acc:#1f5fbf;--accbg:#d6e4ff;--bad:#c0392b;--todo:#e8890c;--wall:#111418;--wP:#111418;--wI:#111418;--wR:#555d6b;--cv:#fff;--note:#c99a06;--notebg:#fff8d9;--inkc:#7c3aed}
#cv:has(#svg.gn) #empty{color:#4a5160}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);pointer-events:none;padding:30px}
#toast{position:fixed;z-index:60;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 14px;border-radius:9px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 10px}
.grid .c2{grid-column:1/-1}
label.l{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:16px 0 8px}
.ap{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px 8px;position:relative}
.ap .rm{position:absolute;top:-10px;right:-8px;background:var(--card)}
.ap.hl{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.b{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--accbg);color:var(--acc);white-space:nowrap}
.b.w{background:var(--warnbg);color:var(--warn)}.b.r{background:var(--badbg);color:var(--bad)}.b.g{background:var(--okbg);color:var(--ok)}
.msg{padding:6px 10px;border-radius:8px;margin-bottom:6px;font-size:14px}
.msg.e{background:var(--badbg);color:var(--bad)}.msg.w{background:var(--warnbg);color:var(--warn)}.msg.o{background:var(--okbg);color:var(--ok)}
.msg[data-selw]{cursor:pointer;text-decoration:underline dotted}
.info{background:var(--bg);border-radius:9px;padding:8px 10px;font-size:14px;margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right}
.tw{overflow:auto}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0}
ol.help{margin:6px 0 0;padding-left:20px;font-size:14px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(760px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
#bPiani{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12);margin-bottom:8px;max-width:calc(100% - 20px)}
#bPiani span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bPiani svg,#cv #bPiani svg{width:20px;height:20px;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bPiani>*{pointer-events:none}
#cv #bPiani{position:absolute;left:10px;bottom:10px;z-index:6;margin:0}
#bZoom{position:absolute;left:10px;bottom:66px;z-index:6;display:flex;align-items:center;justify-content:center;width:48px;height:48px;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
#cv #bZoom svg{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bZoom>*{pointer-events:none}
#zpan{position:absolute;left:10px;bottom:122px;z-index:7;display:flex;flex-direction:column;align-items:center;gap:4px;width:48px;padding:6px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:20px;font-weight:700;line-height:1;touch-action:none}
#zpan[hidden]{display:none}
#zpan input{writing-mode:vertical-lr;direction:rtl;width:40px;height:180px;margin:0;padding:0;border:0;background:none;touch-action:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.pwrap{position:relative}
.pcard{display:flex;align-items:center;justify-content:center;width:100%;height:150px;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--cv);color:var(--ink)}
.pcard svg{width:100%;height:100%}
.pcard.cur{border:3px solid var(--acc)}
.pcard.padd{border-style:dashed;font-size:46px;font-weight:300;color:var(--mut)}
.pdots{position:absolute;right:6px;bottom:6px;min-width:48px;min-height:40px;border-radius:9px}
.pmenu{position:absolute;right:6px;bottom:50px;z-index:2;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.pmenu button{min-width:140px;min-height:44px}
.pnome{text-align:center;font-weight:600;margin-top:6px}
.plist{display:flex;flex-direction:column}
.pask{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 14px;padding:12px;border:1px solid var(--line);border-radius:12px}
.pask label{width:100%;margin:0}
.pask input{flex:1;min-width:180px}
.pask button{min-height:44px;min-width:110px}
.plist button{min-height:48px;text-align:left;border-width:0 0 1px;border-radius:0}
.dxu{display:block;margin:5px 0}.dxl{display:grid;grid-template-columns:18px 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.dxl .sw{width:16px;height:16px;border-radius:4px;border:1px solid var(--line)}
/* menu iniziale e pagina del rilievo */
.hbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.hbar h2{margin:0;font-size:20px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.rcard{display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;padding:10px;border-radius:14px;min-height:240px;overflow:hidden}
.rcard>*{pointer-events:none}
.rcard span{font-size:13px;color:var(--mut)}
.rcard .b{align-self:flex-start;color:var(--warn);background:var(--warnbg);border-radius:20px;padding:1px 9px;font-size:12px}
.rcard .b.g{color:var(--ok);background:var(--okbg)}
.rmini{height:140px;background:var(--bg);border-radius:10px;padding:8px;margin-bottom:6px;color:var(--ink)}
.rmini svg{width:100%;height:100%;display:block}
.radd{align-items:center;justify-content:center;border-style:dashed;color:var(--acc)}
.radd i{font-style:normal;font-size:48px;line-height:1}
.rcard.radd span{color:var(--acc);font-size:15px;font-weight:600}
.prj{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}
.prj.nuovo{grid-template-columns:minmax(0,1fr) 330px}
@media(max-width:800px){.prj,.prj.nuovo{grid-template-columns:1fr}.prj.nuovo>.card{order:-1;position:static!important}}
.luogo{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px;min-height:64px;border-radius:12px}
.luogo>*{pointer-events:none}
.luogo i{font-style:normal;font-size:24px;background:var(--bg);border-radius:10px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.luogo span{flex:1;min-width:0}
.luogo b{display:block;overflow-wrap:anywhere}
.luogo small{display:block;color:var(--mut);font-size:12px}
.luogo em{font-style:normal;font-size:22px;color:var(--mut)}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tot div{background:var(--bg);border-radius:10px;padding:8px 10px}
.tot b{display:block;font-size:19px}
.tot span{font-size:12px;color:var(--mut)}
.azioni button{display:block;width:100%;text-align:left;margin-bottom:6px;min-height:46px}
.fila{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}
.fila>*{flex:0 0 auto}
.fila .piu{width:56px;height:56px;border-radius:50%;font-size:28px;line-height:1;align-self:center;padding:0}
.pp{width:200px;text-align:center}
.pp .pwrap{position:relative}
.pp .pcard{width:100%;height:170px;background:var(--bg);color:var(--ink);padding:10px}
.pp .pcard>*{pointer-events:none}
.pp .pcard svg{width:100%;height:100%;display:block}
.pp .pdots{position:absolute;right:6px;bottom:6px;min-height:34px;padding:2px 10px}
.pp .pnome{margin-top:4px;font-weight:600}
.fila .fth{width:170px}
.fcard{width:160px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:600;border-radius:14px}
.fcard>*{pointer-events:none}
.fcard i{font-style:normal;font-size:12px;background:var(--ink);color:var(--card);border-radius:6px;padding:2px 8px}
#bExp.dirty::after{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
body.full header,body.full .banner,body.full .legend{display:none}
body.full main{padding:6px;max-width:none}
body.full .cols{display:grid;grid-template-columns:minmax(0,1fr) min(380px,42vw);gap:8px;align-items:start}
body.full .cols>.card{margin:0;padding:8px}
body.full #sidecol{height:calc(100vh - 12px);overflow:auto}
body.full #sidecol .card{margin-bottom:8px}
@media(max-width:700px){body.full .cols{display:block}body.full #sidecol{height:auto;overflow:visible;margin-top:8px}}
#bCloseSide{display:none}
.mpop{position:fixed;inset:0;z-index:60;background:rgba(15,20,30,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.mpop.guide{background:rgba(15,20,30,.08)}
@media(min-width:701px){.mpop.guide.gl{justify-content:flex-start}.mpop.guide.gr{justify-content:flex-end}.mpop.guide .mbox{width:min(340px,40vw)}}
.mpop .mskip{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.mpop .mbox{width:min(380px,100%);background:var(--card);border-radius:18px;box-shadow:0 16px 48px rgba(0,0,0,.3);overflow:hidden}
.mpop .mhd{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 18px 10px;gap:10px}
.mpop .mt{font-size:21px;font-weight:700}
.mpop .ms{font-size:14px;color:var(--mut);margin-top:2px}
.mpop .mx{width:40px;height:40px;min-height:40px;border-radius:50%;padding:0;font-size:18px;flex:0 0 auto}
.mpop .mval{text-align:center;font-size:44px;font-weight:500;padding:14px 0 2px;background:var(--bg);border-top:1px solid var(--line)}
.mpop .mval .mu{font-size:24px;color:var(--mut);margin-left:6px}
.mpop .mval .mph{color:var(--mut)}
.mpop .mhint{text-align:center;font-size:13px;color:var(--mut);background:var(--bg);padding:0 0 10px}
.mpop .mkeys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px;background:var(--bg)}
.mpop .mkeys button{height:58px;min-height:58px;font-size:24px;border-radius:12px;background:var(--card)}
.mpop .mkeys .mk2{background:transparent;border-color:transparent}
.mpop .mfoot{display:flex;gap:10px;padding:12px 16px 16px;background:var(--bg)}
.mpop .mok{flex:1;height:52px;min-height:52px;font-size:19px;font-weight:600;background:#222;color:#fff;border-color:#222;border-radius:12px}
.mpop .mdel{height:52px;min-height:52px;color:var(--bad)}
@media(max-width:700px){.mpop{align-items:flex-end;padding:0}.mpop .mbox{border-radius:18px 18px 0 0}}
#fstrip{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
#fstrip .fsh{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
#fstrip .fsh .sp{flex:1}
#fstrip .fsr{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
#fstrip .fsr button{flex:0 0 auto;width:112px;padding:0;border-radius:10px;overflow:hidden;background:var(--card);display:flex;flex-direction:column;min-height:0}
#fstrip .fsr img{width:112px;height:84px;object-fit:cover;display:block}
#fstrip .fsr span{font-size:11.5px;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);text-align:left}
body.full #fstrip{display:none}
/* schermo intero: tutta la larghezza al disegno; il pannello compare sopra la tavola solo quando tocchi un elemento */
body.full .cols{display:block}
body.full #sidecol{display:none}
body.full.hassel #sidecol{display:block;position:fixed;top:10px;right:10px;width:min(380px,44vw);max-height:calc(100vh - 20px);overflow:auto;z-index:20;margin:0;padding:6px;border-radius:14px;background:var(--bg);box-shadow:0 8px 28px rgba(0,0,0,.28)}
body.full.hassel #sidecol .card{margin-bottom:0}
body.full #msgs{display:none}
body.full.hassel #bCloseSide{display:block;margin-left:auto}
@media(max-width:700px){body.full.hassel #sidecol{left:10px;width:auto;top:auto;bottom:10px;max-height:55vh}}
ol.help li{margin-bottom:4px}
/* foto */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.fth{position:relative;padding:0;border-radius:8px;overflow:hidden;aspect-ratio:4/3;background:var(--line);display:flex;align-items:center;justify-content:center;min-height:0}
.fth img{width:100%;height:100%;object-fit:cover;display:block}
.fth .fcap{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fmore{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:7;display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap}
#fmore button{min-height:44px}
#fview{position:fixed;inset:0;z-index:60;background:#0c0e12;display:flex;flex-direction:column;color:#fff}
#fview button{color:var(--ink);background:var(--card)}
#fview button.bad{color:var(--bad)}
#fview button:disabled{opacity:.45}
#fview input{color:var(--ink);background:var(--card)}
#fview .fvbar,#fview .fvfoot{display:flex;gap:8px;align-items:center;padding:8px 12px;flex-wrap:wrap}
#fview .fvmeta{font-size:13px;opacity:.75}
#fview .sp{flex:1}
#fview .fvimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px}
#fview .fvimg img{max-width:100%;max-height:100%;object-fit:contain}
#fview input{flex:1;min-width:200px}
#scheda{display:none}
#lavoro{position:fixed;inset:0;z-index:80;background:rgba(10,12,18,.55);display:flex;align-items:center;justify-content:center}
#lavoro>div{background:var(--card);color:var(--ink);border-radius:14px;padding:18px 26px;max-width:80%;font-weight:600}
@media print{
  @page{size:A4 portrait;margin:12mm}
  body>*:not(#scheda){display:none!important}
  body{background:#fff!important}
  #scheda{display:block;color:#1c2230;font:11pt Arial,sans-serif;--ink:#1c2230;--mut:#687185;--line:#dde1e8;--acc:#1f5fbf;--accbg:#e6efff;--warn:#a86a12;--warnbg:#fff3dc;--bad:#c0392b;--badbg:#fde8e5;--ok:#2f855a;--okbg:#e3f5ea;--wall:#d6d9e1;--wP:#1c2230;--wI:#b8860b;--wR:#d0342c;--grid:transparent;--cv:#fff;--note:#c99a06;--todo:#e8890c;--inkc:#7c3aed;--notebg:#fff8d9;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #scheda>div{break-before:page}
  #scheda>div:first-child{break-before:auto}
  #scheda .spg{height:271mm;display:flex;flex-direction:column}
  #scheda .shd{display:flex;justify-content:space-between;gap:10mm;border-bottom:1.5px solid #1c2230;padding-bottom:3mm;margin-bottom:4mm}
  #scheda .sst{white-space:pre-line;font-size:9.5pt;line-height:1.35}
  #scheda .sst::first-line{font-weight:bold;font-size:11pt}
  #scheda .sti{text-align:right;font-size:9.5pt}
  #scheda .sti b{display:block;font-size:13pt}
  #scheda table{border-collapse:collapse;width:100%;margin-bottom:5mm}
  #scheda td{border:1px solid #c8ccd4;padding:1.6mm 2.5mm;vertical-align:top}
  #scheda td:first-child{width:32%;color:#687185}
  #scheda h2{font-size:12pt;margin:0 0 2mm}
  #scheda .spl{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  #scheda .spl svg{max-width:100%;max-height:100%}
  #scheda .snote{font-size:8.5pt;color:#687185;margin-top:2mm}
  #scheda .stab table{font-size:8.5pt}
  #scheda .stab td,#scheda .stab td:first-child,#scheda .stab th{border:1px solid #c8ccd4;padding:1.2mm 1.8mm;width:auto;color:#1c2230;text-align:left}
  #scheda .stab th{background:#eef0f4;font-weight:bold;font-size:8pt;text-transform:none;letter-spacing:0;white-space:normal}
  #scheda .stab .n{text-align:right}
  #scheda .stab tr{break-inside:avoid}
  #scheda .sfg{display:grid;grid-template-columns:1fr 1fr;gap:5mm;flex:1;min-height:0}
  #scheda .sfg figure{margin:0;display:flex;flex-direction:column;min-height:0;break-inside:avoid}
  #scheda .sfg img{flex:1;min-height:0;width:100%;object-fit:contain;object-position:center top}
  #scheda .sfg figcaption{font-size:8.5pt;margin-bottom:1.5mm;order:-1}
}
</style>
</head>

<header>
  <button id="bBack" hidden></button>
  <h1>Rilievo <span id="curName" class="mut" style="font-weight:400"></span></h1>

  <input type="file" id="fBgCam" accept="image/*" capture="environment" hidden>
</header>
<main id="main"></main>
